name: Build installers
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a new release after successful checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Qt system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Test application and course storage
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m unittest discover -s tests -v
      - name: Collect notices
        run: python packaging/collect_licenses.py
      - name: Freeze application
        run: python -m PyInstaller --noconfirm --clean packaging/PythonTech.spec
      - name: Smoke test Linux bundle
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}
          QT_QUICK_BACKEND: software
        run: dist/PythonTech/PythonTech --smoke-test
      - name: Build Linux installers
        if: runner.os == 'Linux'
        run: python packaging/linux.py
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss'
      - name: Check installed Windows application
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: windows
          QT_QUICK_BACKEND: software
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/installers/*-windows-x64-setup.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'PythonTech-check'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $process = Start-Process -FilePath "$destination/PythonTech.exe" -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Application startup timed out' }
          if ($process.ExitCode -ne 0) { throw "Installed app smoke test failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v6
        with:
          name: installers-${{ runner.os }}
          path: dist/installers/*
          if-no-files-found: error
  release:
    if: inputs.publish_release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd installers
          sha256sum * > SHA256SUMS.txt
          cd ..
          version=$(python -c "from main import VERSION; print(VERSION)")
          test "$(git rev-parse "v$version^{commit}")" = "$GITHUB_SHA"
          gh release create "v$version" installers/* --verify-tag --title "PythonTech $version" --notes-file packaging/RELEASE_NOTES.md
